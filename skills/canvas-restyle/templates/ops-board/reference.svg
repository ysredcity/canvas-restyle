<text x="286.0" y="334.0" font-size="14" font-family="Noto Sans SC" font-weight="normal" fill="#374151" text-anchor="start">依托 50 家自营服务网点，重点推进 "远程监控、预测性维护、能耗管理"，把存量客户长期留在自有体系内；</text>
