<text x="188.0" y="304.0" font-size="14.5" font-family="Noto Sans SC" font-weight="bold" fill="#0c4a6e" text-anchor="start">行业标杆依托 "自营服务网络 + 专业实施体系 + 配件经营" 三线协同布局：</text>
<circle cx="204" cy="329" r="3" fill="#0ea5e9"/>
